<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tag History — Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F8FA; --panel:#FFFFFF; --line:#DDE1E7; --text:#1B2027; --text-dim:#4B5563;
    --amber:#C9691F; --green:#1F8F63; --red:#C4402F; --header-bg:#161B22; --header-text:#EDEFF3; --header-amber:#E8823A;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg); color:var(--text); font-family:'IBM Plex Sans',sans-serif;}
  header{ padding:22px 24px; background:var(--header-bg); }
  .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.12em; color:var(--header-amber); text-transform:uppercase; margin-bottom:4px; }
  h1{ font-size:22px; font-weight:600; color:var(--header-text); }
  main{ max-width:520px; margin:0 auto; padding:28px 20px; }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:22px; }
  label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); margin-bottom:6px; margin-top:16px; }
  label:first-child{ margin-top:0; }
  input[type="password"], input[type="file"]{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:7px; font-size:13px; background:#F1F3F6;
  }
  button{
    margin-top:20px; width:100%; padding:12px; background:var(--amber); color:#fff; border:none; border-radius:8px;
    font-size:14px; font-weight:600; cursor:pointer;
  }
  button:disabled{ opacity:0.6; cursor:default; }
  .result{ margin-top:16px; font-size:13px; font-family:'IBM Plex Mono',monospace; white-space:pre-wrap; }
  .result.ok{ color:var(--green); }
  .result.err{ color:var(--red); }
  a{ color:var(--amber); }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Recircle · Tag Log</div>
  <h1>Admin — Upload Data</h1>
</header>

<main>
  <div class="panel">
    <label for="passcode">Admin passcode</label>
    <input type="password" id="passcode" placeholder="Enter passcode">

    <label for="fileInput">Data file (.csv or .xlsx)</label>
    <input type="file" id="fileInput" accept=".csv,.xlsx,.xls">

    <button id="uploadBtn">Upload</button>
    <div class="result" id="resultBox"></div>
  </div>
  <p style="margin-top:16px; font-size:12.5px; color:var(--text-dim);">
    <a href="/">← Back to search</a>
  </p>
</main>

<script>
document.getElementById('uploadBtn').addEventListener('click', async () => {
  const passcode = document.getElementById('passcode').value;
  const fileInput = document.getElementById('fileInput');
  const resultBox = document.getElementById('resultBox');
  const btn = document.getElementById('uploadBtn');

  if(!passcode){ resultBox.textContent = 'Enter the passcode.'; resultBox.className = 'result err'; return; }
  if(!fileInput.files[0]){ resultBox.textContent = 'Choose a file first.'; resultBox.className = 'result err'; return; }

  btn.disabled = true;
  resultBox.textContent = 'Uploading and processing… this can take a while for large files.';
  resultBox.className = 'result';

  const formData = new FormData();
  formData.append('passcode', passcode);
  formData.append('file', fileInput.files[0]);

  try {
    const res = await fetch('/api/upload', { method: 'POST', body: formData });
    const data = await res.json();
    if(!res.ok){
      resultBox.textContent = 'Error: ' + (data.detail || 'upload failed');
      resultBox.className = 'result err';
    } else {
      resultBox.textContent = `Done!\nFile: ${data.filename}\nRows in file: ${data.rows_in_file}\nNew rows added: ${data.inserted}\nDuplicates skipped: ${data.skipped_duplicates}`;
      resultBox.className = 'result ok';
    }
  } catch(e){
    resultBox.textContent = 'Network error: ' + e.message;
    resultBox.className = 'result err';
  }
  btn.disabled = false;
});
</script>

</body>
</html>
